<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Hello 🎬 | Movie Reviews</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
    }

    header {
      background: #020617;
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #facc15;
    }

    main {
      padding: 30px;
      max-width: 1100px;
      margin: auto;
    }

    .movie-card {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 20px;
      background: #020617;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }

    .movie-card img {
      width: 100%;
      border-radius: 10px;
    }

    .movie-info h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .rating {
      color: #facc15;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .description {
      color: #cbd5f5;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .reviews {
      margin-top: 20px;
    }

    .reviews h3 {
      margin-bottom: 10px;
      border-bottom: 1px solid #334155;
      padding-bottom: 5px;
    }

    .review {
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .review span {
      color: #facc15;
      font-size: 14px;
    }

    form {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    input, textarea, button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }

    input, textarea {
      background: #020617;
      color: #f8fafc;
      border: 1px solid #334155;
    }

    textarea {
      resize: none;
      height: 80px;
    }

    button {
      background: #facc15;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #fde047;
      transform: scale(1.03);
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 14px;
    }

    @media (max-width: 768px) {
      .movie-card {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  🎬 Movie Hello
</header>

<main>

  <div class="movie-card">
    <img src="https://m.media-amazon.com/images/I/81G+0N7FqDL._AC_SY679_.jpg" alt="Movie Poster">

    <div class="movie-info">
      <h2>Inception (2010)</h2>
      <div class="rating">⭐ 8.8 / 10</div>
      <p class="description">
        A skilled thief is offered a chance at redemption if he can plant an idea into a target's subconscious.
        Stylish. Smart. Absolute cinema.
      </p>

      <div class="reviews" id="reviews">
        <h3>User Reviews</h3>
      </div>

      <form onsubmit="addReview(event)">
        <input type="text" id="name" placeholder="Your name" required>
        <input type="number" id="rating" placeholder="Rating (1-10)" min="1" max="10" required>
        <textarea id="comment" placeholder="Write your review..." required></textarea>
        <button type="submit">Post Review</button>
      </form>
    </div>
  </div>

</main>

<footer>
  © 2026 Movie Hello | Say hello to honest movie reviews 🍿
</footer>

<script>
  function addReview(event) {
    event.preventDefault();

    const name = document.getElementById("name").value;
    const rating = document.getElementById("rating").value;
    const comment = document.getElementById("comment").value;

    const reviewDiv = document.createElement("div");
    reviewDiv.classList.add("review");

    reviewDiv.innerHTML = `
      <strong>${name}</strong> <span>⭐ ${rating}/10</span>
      <p>${comment}</p>
    `;

    document.getElementById("reviews").appendChild(reviewDiv);
    event.target.reset();
  }
</script>

</body>
</html>
